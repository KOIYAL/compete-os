name: Bug report
description: Report reproducible CompeteOS behavior that is incorrect or unsafe.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, confidential briefs, personal data, or vulnerability details. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
