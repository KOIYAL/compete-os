name: Feature request
description: Propose a focused, safe improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the blocked outcome, not only a preferred tool.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, compliance, and compatibility impact
      description: Include network access, credentials, dependencies, and event-rule implications.
    validations:
      required: true
